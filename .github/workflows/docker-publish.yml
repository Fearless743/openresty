name: Build and publish OpenResty to GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=1.31.9.1
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate 1Panel image tags and labels
        id: meta-1panel
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-1panel
          tags: |
            type=raw,value=1.31.9.1
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push (1Panel variant)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.1panel
          push: true
          tags: ${{ steps.meta-1panel.outputs.tags }}
          labels: ${{ steps.meta-1panel.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: |
          docker pull ghcr.io/fearless743/openresty:sha-${{ github.sha }}
          docker run --rm --entrypoint openresty \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }} -v
          docker run --rm --entrypoint openresty \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }} -V 2>&1 \
            | grep -E -- '--with-http_v2_module|--with-http_v3_module'

      - name: Verify 1Panel image
        run: |
          docker pull ghcr.io/fearless743/openresty:sha-${{ github.sha }}-1panel
          docker run --rm --entrypoint openresty \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }}-1panel -v
          docker run --rm --entrypoint sh \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }}-1panel \
            -c 'test -f /usr/local/openresty/1pwaf/init.lua && echo 1pwaf OK'
          docker run --rm --entrypoint sh \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }}-1panel \
            -c 'for f in /usr/local/openresty/luajit/lib/lua/5.1/*.so \
                       /usr/local/openresty/1pwaf/libraries/*.so; do \
                 ldd "$f" | grep "not found" && exit 1; \
               done; echo "1pwaf shared objects OK"'
          docker run --rm --entrypoint openresty \
            ghcr.io/fearless743/openresty:sha-${{ github.sha }}-1panel -V 2>&1 \
            | grep -E -- '--with-http_v2_module|--with-http_v3_module'
